name: Build Windows

# 手动触发：在仓库的 Actions 页面点 "Build Windows" -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (onedir)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name InsDownloader_v1.0.3
          --collect-all instaloader
          --collect-all browser_cookie3
          --collect-all websocket
          app.py

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/InsDownloader_v1.0.3" -DestinationPath "InsDownloader_Windows_X64_v1.0.3.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsDownloader_Windows_X64_v1.0.3
          path: InsDownloader_Windows_X64_v1.0.3.zip
